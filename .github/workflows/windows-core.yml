name: Windows core and SMTC
on:
  push:
    branches: [main, codex/windows-port, codex/windows-smtc]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Install Windows HID backend
        shell: pwsh
        run: vcpkg install hidapi:x64-windows
      - name: Configure portable library
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DGALLEON_BUILD_DESKTOP=OFF -DGALLEON_SOURCE_TREE_PATHS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test without hardware
        shell: pwsh
        run: |
          $env:PATH = "$pwd/build/lib/Release;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
      - name: Check library installation
        run: cmake --install build --config Release --prefix staging
