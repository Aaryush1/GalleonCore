name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  # Required checks must run even on site-only PRs; otherwise main is unmergeable.
  pull_request:

concurrency:
  group: galleon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
            flags: ""
          - name: Clang + ASan/UBSan
            cxx: clang++
            flags: "-DGALLEON_SANITIZE=ON -DGALLEON_FUZZ=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          bash tools/ci/install-ubuntu-deps.sh cmake g++ clang libclang-rt-18-dev \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev libhidapi-dev pkg-config \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DGALLEON_WERROR=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Fuzz (60 s)
        if: contains(matrix.flags, 'GALLEON_FUZZ')
        run: ./build/fuzz/fuzz_input_report -max_total_time=60

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          bash tools/ci/install-ubuntu-deps.sh cmake g++ clang-tidy \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev libhidapi-dev pkg-config pipx \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript
      - name: Configure
        run: cmake -B build
      - name: Build (generates moc files)
        run: cmake --build build -j
      - name: clang-tidy
        run: run-clang-tidy -quiet -p build '(lib/src|daemon|bosun|tests|media)/[^/]+\.cpp$'
      - name: qmllint
        run: /usr/lib/qt6/bin/qmllint widgets/*.qml bosun/qml/*.qml daemon/qml/*.qml
      - name: Decisions of tools/check.py
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' # -B: no __pycache__ for reuse to complain about
      - name: REUSE licensing
        run: pipx run reuse lint
