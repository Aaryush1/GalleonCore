name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "tools/website/download_stats.py", "tools/test_download_stats*"]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check counter changes
        if: github.event_name == 'push'
        run: |
          python3 -m unittest discover -s tools -p 'test_download_stats.py'
          node tools/test_download_stats_js.js
      - name: Collect daily download measurements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/website/download_stats.py \
            --previous-url https://galleoncore.xyz/downloads-weekly.json \
            --previous-url https://galleoncore.pages.dev/downloads-weekly.json \
            --previous-url https://paullux.github.io/GalleonCore/downloads-weekly.json \
            --output site/downloads-weekly.json
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e272635a5bb7cf86402f363a755ce70b
          command: pages deploy site --project-name=galleoncore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
