name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build seven-day release download counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tools -p 'test_download_stats.py'
          python3 tools/website/download_stats.py \
            --previous-url https://paullux.github.io/GalleonCore/downloads-weekly.json \
            --output site/downloads-weekly.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
